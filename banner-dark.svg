<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Swapnil Meshram — Senior Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2dd4bf" opacity="0.14"/>
    </pattern>
    <clipPath id="round">
      <rect width="1000" height="280" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect x="640" y="0" width="360" height="280" fill="url(#dots)"/>
    <circle cx="880" cy="60" r="220" fill="url(#glow)"/>

    <g stroke="#2dd4bf" stroke-width="1.6" fill="none" opacity="0.22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M770 108 l-30 32 30 32"/>
      <path d="M842 108 l30 32 -30 32"/>
      <path d="M816 96 l-20 88"/>
    </g>

    <rect x="56" y="62" width="4" height="96" rx="2" fill="url(#accent)"/>

    <text x="84" y="108" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Swapnil Meshram</text>
    <text x="86" y="142" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#2dd4bf" letter-spacing="3.4">SENIOR FULL STACK DEVELOPER</text>
    <text x="86" y="172" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b949e">Nagpur, India &#183; building for healthcare, climate-tech and GenAI</text>

    <g font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="12.5" fill="#9fb3c8">
      <rect x="84"  y="198" width="66"  height="28" rx="14" fill="#161d2b" stroke="#2c3646"/>
      <text x="117"  y="216" text-anchor="middle">React</text>

      <rect x="158" y="198" width="76"  height="28" rx="14" fill="#161d2b" stroke="#2c3646"/>
      <text x="196" y="216" text-anchor="middle">Angular</text>

      <rect x="242" y="198" width="78"  height="28" rx="14" fill="#161d2b" stroke="#2c3646"/>
      <text x="281" y="216" text-anchor="middle">Node.js</text>

      <rect x="328" y="198" width="98"  height="28" rx="14" fill="#161d2b" stroke="#2c3646"/>
      <text x="377" y="216" text-anchor="middle">Spring Boot</text>

      <rect x="434" y="198" width="124" height="28" rx="14" fill="#10251f" stroke="#1f4d43"/>
      <text x="496" y="216" text-anchor="middle" fill="#2dd4bf">GCP Certified</text>
    </g>

    <rect x="0" y="277" width="1000" height="3" fill="url(#accent)"/>
